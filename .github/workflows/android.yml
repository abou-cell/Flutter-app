name: Build Poker Math Pro APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'poker-math-apk/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build installable APK
        working-directory: poker-math-apk
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp poker-math-apk/app/build/outputs/apk/debug/app-debug.apk PokerMathPro-v1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PokerMathPro-v1.0.0-APK
          path: PokerMathPro-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
