name: Build KieChat Connect APK

on:
  push:
    branches:
      - kiechat-connect-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore source
        run: |
          base64 -d KieChatConnect-source.zip.b64 > KieChatConnect-source.zip
          unzip -q -o KieChatConnect-source.zip

      - name: Build APK
        run: gradle -p kiechat_connect :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp kiechat_connect/app/build/outputs/apk/debug/app-debug.apk KieChat-Connect-v1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KieChat-Connect-v1-APK
          path: KieChat-Connect-v1.apk
